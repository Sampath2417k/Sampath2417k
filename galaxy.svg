<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0d1117"/>
  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    .galaxy { animation: spin 8s linear infinite; transform-origin: 200px 200px; }
    .s1 { fill: #58a6ff; font-family: monospace; font-size: 8px; }
    .s2 { fill: #79c0ff; font-family: monospace; font-size: 7px; }
    .s3 { fill: #1f6feb; font-family: monospace; font-size: 6px; }
    .s4 { fill: #f0883e; font-family: monospace; font-size: 7px; }
  </style>
  <g class="galaxy">
    <text x="200" y="200" class="s1" text-anchor="middle">*</text>
    <text x="230" y="195" class="s1">.</text>
    <text x="260" y="185" class="s2">*</text>
    <text x="280" y="170" class="s1">.</text>
    <text x="300" y="150" class="s3">*</text>
    <text x="310" y="125" class="s2">.</text>
    <text x="320" y="100" class="s4">*</text>
    <text x="170" y="205" class="s1">.</text>
    <text x="140" y="215" class="s2">*</text>
    <text x="120" y="230" class="s1">.</text>
    <text x="100" y="250" class="s3">*</text>
    <text x="90" y="275" class="s2">.</text>
    <text x="80" y="300" class="s4">*</text>
    <text x="200" y="170" class="s1">.</text>
    <text x="220" y="165" class="s2">*</text>
    <text x="240" y="155" class="s1">.</text>
    <text x="250" y="140" class="s3">*</text>
    <text x="260" y="120" class="s2">.</text>
    <text x="180" y="230" class="s1">*</text>
    <text x="160" y="235" class="s2">.</text>
    <text x="150" y="245" class="s1">*</text>
    <text x="140" y="260" class="s3">.</text>
    <text x="130" y="280" class="s2">*</text>
    <text x="210" y="210" class="s4">.</text>
    <text x="190" y="190" class="s4">*</text>
  </g>
  <g>
    <text x="75" y="75" class="s3" style="animation: twinkle 3s ease-in-out infinite;">.</text>
    <text x="320" y="60" class="s3" style="animation: twinkle 2s ease-in-out infinite;">*</text>
    <text x="50" y="320" class="s3" style="animation: twinkle 2.5s ease-in-out infinite;">.</text>
    <text x="340" y="340" class="s3" style="animation: twinkle 4s ease-in-out infinite;">*</text>
    <text x="30" y="150" class="s3" style="animation: twinkle 3.5s ease-in-out infinite;">.</text>
    <text x="360" y="180" class="s3" style="animation: twinkle 1.5s ease-in-out infinite;">*</text>
  </g>
</svg>
