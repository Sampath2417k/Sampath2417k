<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0d1117"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="10s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="4s" repeatCount="indefinite" additive="sum"/>
      <text x="200" y="60" fill="#58a6ff" font-family="monospace" font-size="14" text-anchor="middle">*</text>
      <text x="200" y="340" fill="#58a6ff" font-family="monospace" font-size="14" text-anchor="middle">*</text>
      <text x="60" y="200" fill="#58a6ff" font-family="monospace" font-size="14" text-anchor="middle">*</text>
      <text x="340" y="200" fill="#58a6ff" font-family="monospace" font-size="14" text-anchor="middle">*</text>
      <text x="100" y="100" fill="#f0883e" font-family="monospace" font-size="12" text-anchor="middle">+</text>
      <text x="300" y="100" fill="#f0883e" font-family="monospace" font-size="12" text-anchor="middle">+</text>
      <text x="100" y="300" fill="#f0883e" font-family="monospace" font-size="12" text-anchor="middle">+</text>
      <text x="300" y="300" fill="#f0883e" font-family="monospace" font-size="12" text-anchor="middle">+</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="-360 200 200" dur="15s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;0.85;1" dur="5s" repeatCount="indefinite" additive="sum"/>
      <text x="200" y="100" fill="#3fb950" font-family="monospace" font-size="18" text-anchor="middle">o</text>
      <text x="200" y="300" fill="#3fb950" font-family="monospace" font-size="18" text-anchor="middle">o</text>
      <text x="100" y="200" fill="#3fb950" font-family="monospace" font-size="18" text-anchor="middle">o</text>
      <text x="300" y="200" fill="#3fb950" font-family="monospace" font-size="18" text-anchor="middle">o</text>
      <text x="140" y="140" fill="#58a6ff" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="260" y="140" fill="#58a6ff" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="140" y="260" fill="#58a6ff" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="260" y="260" fill="#58a6ff" font-family="monospace" font-size="10" text-anchor="middle">.</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="6s" repeatCount="indefinite"/>
    <g>
      <text x="70" y="70" fill="#f0883e" font-family="monospace" font-size="16" text-anchor="middle">#</text>
      <text x="330" y="70" fill="#f0883e" font-family="monospace" font-size="16" text-anchor="middle">#</text>
      <text x="70" y="330" fill="#f0883e" font-family="monospace" font-size="16" text-anchor="middle">#</text>
      <text x="330" y="330" fill="#f0883e" font-family="monospace" font-size="16" text-anchor="middle">#</text>
      <text x="120" y="80" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="280" y="80" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="120" y="320" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="280" y="320" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="80" y="120" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="320" y="120" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="80" y="280" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
      <text x="320" y="280" fill="#3fb950" font-family="monospace" font-size="10" text-anchor="middle">.</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="-360 200 200" dur="8s" repeatCount="indefinite"/>
    <text x="200" y="145" fill="#58a6ff" font-family="monospace" font-size="20" text-anchor="middle">@</text>
    <text x="200" y="255" fill="#58a6ff" font-family="monospace" font-size="20" text-anchor="middle">@</text>
    <text x="145" y="200" fill="#58a6ff" font-family="monospace" font-size="20" text-anchor="middle">@</text>
    <text x="255" y="200" fill="#58a6ff" font-family="monospace" font-size="20" text-anchor="middle">@</text>
  </g>

  <text x="200" y="204" fill="#3fb950" font-family="monospace" font-size="24" text-anchor="middle">
    ◆
    <animate attributeName="fill" values="#3fb950;#58a6ff;#f0883e;#3fb950" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
